name: Link check

# The tutorial links to tools that change their docs often. Check weekly, outside the main CI so a flaky site never blocks a merge.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:links
